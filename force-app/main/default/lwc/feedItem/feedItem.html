<template>
    <!-- Email rendering -->
    <template if:true={isEmailElement}>
        <c-feed-email email-data={element}>
        </c-feed-email>
    </template>
    <template if:false={isEmailElement}>
        <li>
            <div class="slds-timeline__item_expandable slds-timeline__item_event">
                <span class="slds-assistive-text">{defaultIconName}</span>
                <div class="slds-media">
                    <div class="slds-media__figure">
                        <button class="slds-button slds-button_icon slds-m-right_x-small" 
                                onclick={toggleExpand} 
                                aria-controls="email-content" 
                                aria-expanded={isExpanded}>
                            <lightning-icon 
                                icon-name={buttonIconName} 
                                size="x-small" 
                                class={iconClass}>
                            </lightning-icon>
                        </button>

                        <div class={iconContainerClass} title={defaultIconName}>
                            <lightning-icon icon-name={defaultIconName} size="small"></lightning-icon>
                        </div>
                    </div>
                    <div class="slds-media__body">
                        <div class="slds-grid slds-grid_align-spread slds-timeline__trigger">
                            <div
                                class="slds-grid slds-grid_vertical-align-center slds-truncate_container_75 slds-no-space">
                                <h3 class="slds-truncate" title={header}>
                                    <template if:true={relatedObjectId}>
                                        <lightning-formatted-url value={relatedObjectUrl} label={header} class="slds-text-title_bold">
                                        </lightning-formatted-url>
                                    </template>
                                    <template if:false={relatedObjectId}>
                                        <strong>{header}</strong>
                                    </template>

                                </h3>
                            </div>
                            <div class="slds-timeline__actions slds-timeline__actions_inline">
                                <template if:true={hasDate}>
                                    <lightning-formatted-date-time 
                                        value={createdDateValue} 
                                        year="numeric"
                                        month="short"
                                        day="2-digit"
                                        hour="2-digit"
                                        minute="2-digit"
                                        class="slds-timeline__date">
                                    </lightning-formatted-date-time>
                                </template>
                            </div>
                        </div>
                        <template if:true={hasTrackedChanges}>
                            <div class="slds-m-horizontal_xx-small slds-m-top_x-small">
                                <template for:each={formattedTrackedChanges} for:item="change">
                                    <div key={change.fieldName} class="slds-m-bottom_xx-small">
                                        <span class="slds-text-body_small">
                                            <strong>{change.fieldName}:</strong>
                                            <template if:true={change.oldValue}>
                                                <span class="slds-m-horizontal_xx-small">
                                                    <span class="slds-text-color_error">{change.oldValue}</span>
                                                    <span class="slds-m-horizontal_xx-small">→</span>
                                                    <span class="slds-text-color_success">{change.newValue}</span>
                                                </span>
                                            </template>
                                            <template if:false={change.oldValue}>
                                                <span class="slds-m-horizontal_xx-small slds-text-color_success">{change.newValue}</span>
                                            </template>
                                        </span>
                                    </div>
                                </template>
                            </div>
                        </template>
                        <template if:false={hasTrackedChanges}>
                            <template if:true={hasBodyText}>
                                <template if:true={isRichTextBody}>
                                    <div class="slds-m-horizontal_xx-small slds-text-body_regular rich-text-body" 
                                         lwc:dom="manual">
                                    </div>
                                </template>
                                <template if:false={isRichTextBody}>
                                    <p class="slds-m-horizontal_xx-small slds-text-body_regular">
                                        {bodyText}
                                    </p>
                                </template>
                            </template>
                        </template>
                    </div>
                </div>
            </div>
        </li>
    </template>




</template>
