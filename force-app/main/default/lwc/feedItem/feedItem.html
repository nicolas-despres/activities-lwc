<template>
    <li class="slds-item slds-p-around_medium">
        <div class="">
            <div class="slds-media__figure">
                
            </div>
            <div class="slds-media__body">
                <div class="slds-grid slds-grid_align-spread slds-m-bottom_x-small">
                    <div class="slds-truncate">
                        <span class="slds-text-title_bold">
                            
                                {header}
                           
                           
                        </span>
                      
                            <span class="slds-text-color_weak slds-m-left_x-small">({element.type})</span>
                      
                    </div>
                    <div class="slds-text-color_weak slds-text-body_small">
                        {element.relativeCreatedDate}
                    </div>
                </div>

                <!-- Email rendering -->
                <template if:true={isEmailElement}>
                    <div class="email-toggle-container">
                        <button class="slds-button slds-button_icon slds-button_icon-border-filled email-toggle-button"
                            onclick={toggleEmailContent}
                            aria-expanded={isEmailExpanded}
                            aria-label="Toggle email content">
                            <lightning-icon icon-name={toggleIcon} size="x-small" class="slds-button__icon"></lightning-icon>
                            <span class="slds-assistive-text">Toggle email content</span>
                        </button>
                        
                        <template if:true={isEmailExpanded}>
                            <div class="email slds-box slds-theme_default slds-m-bottom_small">
                                <div class="slds-grid slds-wrap slds-gutters">
                                    <div class="slds-col slds-size_1-of-1">
                                        <div class="row">
                                            <span class="label">Subject:</span>
                                            <span class="value">{emailSubject}</span>
                                        </div>
                                    </div>
                                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                        <div class="row">
                                            <span class="label">From:</span>
                                            <span class="value">{emailFromAddress}</span>
                                        </div>
                                    </div>
                                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                        <div class="row">
                                            <span class="label">To:</span>
                                            <span class="value">{emailToAddresses}</span>
                                        </div>
                                    </div>

                                    <template if:true={element.capabilities.emailMessage.ccAddresses}>
                                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                            <div class="row">
                                                <span class="label">Cc:</span>
                                                <span class="value">{emailCcAddresses}</span>
                                            </div>
                                        </div>
                                    </template>
                                    <template if:true={element.capabilities.emailMessage.bccAddresses}>
                                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                            <div class="row">
                                                <span class="label">Bcc:</span>
                                                <span class="value">{emailBccAddresses}</span>
                                            </div>
                                        </div>
                                    </template>

                                    <div class="slds-col slds-size_1-of-1">
                                        <div class="row">
                                            <span class="label">Direction:</span>
                                            <span class="value">{emailDirection}</span>
                                        </div>
                                    </div>
                                    <div class="slds-col slds-size_1-of-1">
                                        <div class="row">
                                            <span class="label">Status:</span>
                                            <span class="value badge">{emailStatus}</span>
                                        </div>
                                    </div>

                                    <div class="slds-col slds-size_1-of-1 slds-m-top_small">
                                        <div class="row">
                                            <span class="label block">Body:</span>
                                        </div>
                                        <div class="email-body slds-box slds-m-top_x-small">
                                            <!-- Render as preformatted text to mimic email block -->
                                            <pre class="wrap">{emailBody}</pre>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </div>
                </template>

                <!-- Fallback for non-email elements (engagement interactions) -->
                <template if:false={isEmailElement}>
                    <div class="slds-text-color_weak slds-p-around_small slds-border_top">
                        <template if:true={element.Channel__c}>
                            <div class="slds-grid slds-gutters slds-wrap">
                                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                    <div class="row">
                                        <span class="label">Channel:</span>
                                        <span class="value">{element.Channel__c.value}</span>
                                    </div>
                                </div>
                                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                    <div class="row">
                                        <span class="label">Date:</span>
                                        <span class="value">{createdDateValue}</span>
                                    </div>
                                </div>
                            </div>
                        </template>
                        <template if:false={element.Channel__c}>
                            This feed element type is not yet supported in this panel.
                        </template>
                    </div>
                </template>
            </div>
        </div>

      
    </li>
</template>
