<template>
    <!-- Email rendering -->
    <template if:true={isEmailElement}>
        <c-feed-email email-data={element}>
        </c-feed-email>
    </template>
    <template if:false={isEmailElement}>
        <li>
            <div class="slds-timeline__item_expandable slds-timeline__item_event">
                <span class="slds-assistive-text">{defaultIconName}</span>
                <div class="slds-media">
                    <div class="slds-media__figure">
                        <button class="slds-button slds-button_icon slds-m-right_x-small" 
                                onclick={toggleExpand} 
                                aria-controls="email-content" 
                                aria-expanded={isExpanded}>
                            <lightning-icon 
                                icon-name={buttonIconName} 
                                size="x-small" 
                                class={iconClass}>
                            </lightning-icon>
                        </button>

                      
                       
                        <div class={iconClass} title={defaultIconName}>
                            <lightning-icon icon-name={defaultIconName} size="small"></lightning-icon>
                        </div>
                    </div>
                    <div class="slds-media__body">
                        <div class="slds-grid slds-grid_align-spread slds-timeline__trigger">
                            <div
                                class="slds-grid slds-grid_vertical-align-center slds-truncate_container_75 slds-no-space">
                                <h3 class="slds-truncate" title={header}>
                                    <template if:true={element.relatedObjectId}>
                                        <lightning-formatted-url value={relatedObjectUrl} label={header} class="slds-text-title_bold">
                                        </lightning-formatted-url>
                                    </template>
                                    <template if:false={element.relatedObjectId}>
                                        <strong>{header}</strong>
                                    </template>

                                </h3>
                            </div>
                            <div class="slds-timeline__actions slds-timeline__actions_inline">
                                <p class="slds-timeline__date">{createdDateValue}</p>
                            </div>
                        </div>
                        <p class="slds-m-horizontal_xx-small">
                            {bodyText}
                        </p>
                    </div>
                </div>
            </div>
        </li>
    </template>




</template>
